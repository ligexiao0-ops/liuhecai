name: Next-day official HKJC sync
on:
  schedule:
    - cron: '5 12 * * *'
    - cron: '35 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: next-day-draw-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Append completed draws from earlier Beijing dates
        run: python3 tools/sync_hkjc_next_day.py --write
      - name: Publish visible sync status
        if: always()
        run: |
          if [ ! -f automatic-sync-status.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automatic-sync-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update next-day draw sync status'
          git push origin HEAD:master
