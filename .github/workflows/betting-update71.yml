name: Betting ranks hourly archive
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: '每彩本轮最多补采的历史期数（0—30）'
        required: false
        default: '5'
permissions:
  contents: write
concurrency:
  group: betting-data-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: google-chrome --version
      - name: Collect public current and historical rankings
        env:
          BETTING_BACKFILL: ${{ inputs.backfill || '5' }}
          BETTING_DATA_DIR: betting-data
        run: python tools/collect-betting71.py
      - name: Preserve successful data and collection status
        if: always()
        run: |
          if [ ! -d betting-data ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add betting-data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: archive betting ranks and settlement status'
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betting-data-report
          path: betting-data/index.json
