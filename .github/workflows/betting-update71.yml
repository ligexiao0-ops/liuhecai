name: Evening betting ranks archive
on:
  schedule:
    - cron: '50 10 * * *'
  workflow_dispatch:
    inputs:
      evening_watch:
        description: '启动今晚剩余时点值守（错过时点标缺失）'
        type: boolean
        default: false
      validation_only:
        description: '仅验证晚间计划与时点边界，不采集资料'
        type: boolean
        default: false
      backfill:
        description: '每彩本轮最多补采的历史期数（0—30）'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: betting-data-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: google-chrome --version
      - name: Collect public current and historical rankings
        env:
          BETTING_BACKFILL: ${{ inputs.backfill || '0' }}
          BETTING_DATA_DIR: betting-data
        run: |
          if [ "${{ inputs.validation_only }}" = "true" ]; then
            python tools/test-evening80.py
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.evening_watch }}" = "true" ]; then
            python tools/evening-archive80.py
          else
            python tools/collect-betting71.py
          fi
      - name: Preserve successful data and collection status
        if: always()
        run: |
          if [ ! -d betting-data ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add betting-data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: archive betting ranks and settlement status'
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betting-data-report
          path: betting-data/index.json
