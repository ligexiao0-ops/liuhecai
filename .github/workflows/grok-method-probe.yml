name: Validate supplied HTML extraction method
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python tools/cloud-probe/test_grok_method.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplied-method-results
          path: cloud-probe-output/
