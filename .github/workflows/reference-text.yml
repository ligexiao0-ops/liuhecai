name: Refresh website reference text
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: next-day-draw-sync
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/collect_website_text.py
      - run: python3 tools/collect_three_sources.py
      - name: Save reference snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website-text-cache.json three-source-cache.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh third-party reference text'
          git push origin HEAD:master
      - name: Rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds --silent
