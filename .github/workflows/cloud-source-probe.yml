name: Cloud source reachability validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: google-chrome --version
      - run: python tools/cloud-probe/probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betting-cloud-probe-v1
          path: cloud-probe-output/
